name: Benchmark

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: checkout pull request
      uses: actions/checkout@v4
      with:
        path: head

    - name: checkout base branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # The benchmark project of the pull request is used for both runs, so that exactly the same benchmarks are compared.
    - name: benchmark base branch
      run: |
        dotnet build head/Mjml.Net.Benchmark -c Release -p:MjmlSourceRoot=$GITHUB_WORKSPACE/base
        mkdir -p out && cp -r head/Mjml.Net.Benchmark/bin/Release/net10.0 out/base
        cd out/base && dotnet Mjml.Net.Benchmark.dll --ci $GITHUB_WORKSPACE/results/base

    - name: benchmark pull request
      run: |
        dotnet build head/Mjml.Net.Benchmark -c Release --no-incremental
        cp -r head/Mjml.Net.Benchmark/bin/Release/net10.0 out/head
        cd out/head && dotnet Mjml.Net.Benchmark.dll --ci $GITHUB_WORKSPACE/results/head

    - name: compare
      run: |
        dotnet out/head/Mjml.Net.Benchmark.dll --compare \
          results/base/results/Mjml.Net.Benchmarking.CiBenchmarks-report-full.json \
          results/head/results/Mjml.Net.Benchmarking.CiBenchmarks-report-full.json \
          results/comparison.md
        cat results/comparison.md >> $GITHUB_STEP_SUMMARY

    # Pull requests from forks only get a read-only token, the results are still in the job summary.
    - name: comment
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('results/comparison.md', 'utf8');
          const marker = '<!-- mjml-net-benchmark -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(x => x.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
